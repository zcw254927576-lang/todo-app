<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b7fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办标签">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>待办标签</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #5b7fff;
    --primary-light: #eef1ff;
    --danger: #ff5b5b;
    --success: #2ecc71;
    --bg: #f5f6fa;
    --card: #fff;
    --text: #2d3436;
    --text-secondary: #636e72;
    --border: #e8eaed;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 100px;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  .header {
    background: var(--primary);
    color: #fff;
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    -webkit-app-region: drag;
  }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header .sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .container { padding: 12px 16px; }

  /* 输入区 */
  .input-area {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .input-row { display: flex; gap: 8px; }
  .input-row input[type="text"] {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .input-row input[type="text"]:focus { border-color: var(--primary); }
  .input-row .add-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .input-row .add-btn:active { opacity: 0.7; }

  /* 标签选择 */
  .tag-select {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .tag-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: none;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    opacity: 0.5;
  }
  .tag-btn:active { transform: scale(0.95); }
  .tag-btn.active { opacity: 1; }

  /* 标签管理 */
  .tag-mgr-toggle {
    text-align: right;
    margin-top: 8px;
  }
  .tag-mgr-toggle span {
    font-size: 12px;
    color: var(--primary);
    cursor: pointer;
    padding: 4px;
  }
  .tag-mgr {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    display: none;
  }
  .tag-mgr.show { display: block; }
  .tag-mgr-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .tag-mgr-input { display: flex; gap: 6px; margin-bottom: 8px; }
  .tag-mgr-input input {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    -webkit-appearance: none;
  }
  .tag-mgr-input input:focus { border-color: var(--primary); }
  .tag-mgr-input button {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tag-mgr-input button:active { opacity: 0.7; }
  .tag-mgr-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-mgr-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
  }
  .tag-mgr-item .del-tag {
    cursor: pointer;
    font-size: 14px;
    opacity: 0.6;
    padding: 2px;
  }
  .tag-mgr-item .del-tag:active { opacity: 1; }

  /* 过滤栏 */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-item {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .filter-item:active { transform: scale(0.96); }
  .filter-item.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* 待办列表 */
  .todo-list { display: flex; flex-direction: column; gap: 8px; }
  .todo-empty {
    text-align: center;
    padding: 60px 0;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 2;
  }
  .todo-empty .big { font-size: 48px; display: block; margin-bottom: 12px; }
  .todo-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: opacity 0.2s;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .todo-item.done { opacity: 0.55; }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-secondary); }
  .todo-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.15s;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
  }
  .todo-check:active { transform: scale(0.85); }
  .todo-check.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .todo-body { flex: 1; min-width: 0; }
  .todo-text { font-size: 15px; line-height: 1.4; word-break: break-word; }
  .todo-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .todo-tag {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .todo-date { font-size: 11px; color: var(--text-secondary); }
  .todo-del {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .todo-del:active { background: #fee; color: var(--danger); }

  /* 统计 */
  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 4px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stats .clear-btn {
    color: var(--danger);
    font-size: 12px;
    cursor: pointer;
    border: none;
    background: none;
    opacity: 0.6;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .stats .clear-btn:active { opacity: 1; background: #fee; }

  /* 安装提示横幅 */
  .install-banner {
    display: none;
    background: var(--card);
    padding: 12px 16px;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    align-items: center;
    gap: 12px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .install-banner.show { display: flex; }
  .install-banner .info { flex: 1; font-size: 13px; }
  .install-banner .info strong { display: block; font-size: 14px; }
  .install-banner .close-btn {
    border: none;
    background: none;
    font-size: 18px;
    color: #999;
    cursor: pointer;
    padding: 4px;
  }
  .install-banner .install-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .install-banner .install-btn:active { opacity: 0.8; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 深色模式 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #e8e8e8;
      --text-secondary: #a0a0b0;
      --border: #2a2a4a;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .input-row input[type="text"],
    .tag-mgr-input input {
      background: #1a1a2e;
      color: #e8e8e8;
      border-color: #2a2a4a;
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>待办标签</h1>
  <div class="sub" id="todayStr"></div>
</div>

<div class="container">
  <!-- 输入 -->
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="写一个待办..." maxlength="100" autocomplete="off">
      <button class="add-btn" onclick="addTodo()">+</button>
    </div>
    <div class="tag-select" id="inputTags"></div>
  </div>

  <!-- 标签管理 -->
  <div class="tag-mgr-toggle">
    <span onclick="toggleTagMgr()">🏷️ 管理标签</span>
  </div>
  <div class="tag-mgr" id="tagMgr">
    <div class="tag-mgr-title">管理标签</div>
    <div class="tag-mgr-input">
      <input type="text" id="newTagInput" placeholder="新标签名称" maxlength="10">
      <button onclick="addTag()">添加</button>
    </div>
    <div class="tag-mgr-list" id="tagMgrList"></div>
  </div>

  <!-- 过滤 -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- 统计 -->
  <div class="stats">
    <span id="statsText">0 项待办</span>
    <button class="clear-btn" onclick="clearDone()">清除已完成</button>
  </div>

  <!-- 列表 -->
  <div class="todo-list" id="todoList"></div>
</div>

<!-- 安装横幅 -->
<div class="install-banner" id="installBanner">
  <div class="info">
    <strong>安装待办标签</strong>
    <span>安装到桌面，离线也能用</span>
  </div>
  <button class="install-btn" id="installBtn">安装</button>
  <button class="close-btn" onclick="hideInstallBanner()">✕</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 数据 ==========
const TAG_COLORS = [
  '#5b7fff', '#ff6b6b', '#2ecc71', '#f39c12', '#9b59b6',
  '#1abc9c', '#e74c3c', '#3498db', '#e67e22', '#636e72'
];
const DEFAULT_TAGS = ['工作', '生活', '学习'];

let state = { todos: [], tags: [], filter: 'all', selectedTags: [] };

// ========== 持久化 ==========
function loadState() {
  try {
    const raw = localStorage.getItem('todoapp_data');
    if (raw) {
      const saved = JSON.parse(raw);
      state.todos = saved.todos || [];
      state.tags = saved.tags || [];
      return;
    }
  } catch(e) {}
  state.todos = [];
  state.tags = DEFAULT_TAGS.map((name, i) => ({
    id: Date.now() + i, name, color: TAG_COLORS[i]
  }));
}

function saveState() {
  try {
    localStorage.setItem('todoapp_data', JSON.stringify({
      todos: state.todos, tags: state.tags
    }));
  } catch(e) {}
}

// ========== Toast ==========
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== 标签 ==========
function getTagColor(tagId) {
  const t = state.tags.find(x => x.id === tagId);
  return t ? t.color : '#636e72';
}
function getTagName(tagId) {
  const t = state.tags.find(x => x.id === tagId);
  return t ? t.name : '未知';
}

function addTag() {
  const input = document.getElementById('newTagInput');
  const name = input.value.trim();
  if (!name) return;
  if (state.tags.find(t => t.name === name)) {
    showToast('标签已存在'); return;
  }
  state.tags.push({ id: Date.now(), name, color: TAG_COLORS[state.tags.length % TAG_COLORS.length] });
  input.value = '';
  saveState();
  renderAll();
  showToast('标签已添加');
}

function deleteTag(tagId) {
  if (!confirm('删除这个标签？')) return;
  state.tags = state.tags.filter(t => t.id !== tagId);
  state.todos.forEach(t => { t.tags = t.tags.filter(id => id !== tagId); });
  if (state.filter === tagId) state.filter = 'all';
  saveState();
  renderAll();
}

function toggleTagMgr() {
  document.getElementById('tagMgr').classList.toggle('show');
  renderTagMgrList();
}

function renderTagMgrList() {
  const el = document.getElementById('tagMgrList');
  if (!state.tags.length) {
    el.innerHTML = '<span style="font-size:13px;color:#999">还没有标签</span>';
    return;
  }
  el.innerHTML = state.tags.map(t =>
    `<span class="tag-mgr-item" style="background:${t.color}22;color:${t.color}">
      ${t.name}
      <span class="del-tag" onclick="deleteTag(${t.id})">×</span>
    </span>`
  ).join('');
}

// ========== 待办 ==========
function addTodo() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) { showToast('请输入待办内容'); return; }
  state.todos.unshift({
    id: Date.now(), text, done: false,
    tags: [...state.selectedTags], createdAt: Date.now()
  });
  input.value = '';
  state.selectedTags = [];
  saveState();
  renderAll();
}

function toggleTodo(id) {
  const todo = state.todos.find(t => t.id === id);
  if (todo) { todo.done = !todo.done; saveState(); renderAll(); }
}

function deleteTodo(id) {
  state.todos = state.todos.filter(t => t.id !== id);
  saveState();
  renderAll();
}

function clearDone() {
  const done = state.todos.filter(t => t.done);
  if (!done.length) { showToast('没有已完成的待办'); return; }
  if (!confirm(`清除 ${done.length} 项已完成待办？`)) return;
  state.todos = state.todos.filter(t => !t.done);
  saveState();
  renderAll();
  showToast(`已清除 ${done.length} 项`);
}

// ========== 输入区标签选择 ==========
function renderInputTags() {
  const el = document.getElementById('inputTags');
  if (!state.tags.length) {
    el.innerHTML = '<span style="font-size:12px;color:#999">先添加标签</span>';
    return;
  }
  el.innerHTML = state.tags.map(t => {
    const active = state.selectedTags.includes(t.id);
    return `<button class="tag-btn ${active?'active':''}"
      style="background:${t.color}22;color:${t.color}"
      onclick="toggleSelectTag(${t.id})">${t.name}</button>`;
  }).join('');
}

function toggleSelectTag(tagId) {
  const idx = state.selectedTags.indexOf(tagId);
  if (idx > -1) state.selectedTags.splice(idx, 1);
  else state.selectedTags.push(tagId);
  renderInputTags();
}

// ========== 过滤栏 ==========
function renderFilterBar() {
  const el = document.getElementById('filterBar');
  let html =
    `<span class="filter-item ${state.filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部</span>` +
    `<span class="filter-item ${state.filter === 'undo' ? 'active' : ''}" onclick="setFilter('undo')">未完成</span>` +
    `<span class="filter-item ${state.filter === 'done' ? 'active' : ''}" onclick="setFilter('done')">已完成</span>`;
  state.tags.forEach(t => {
    const active = state.filter === t.id;
    html += `<span class="filter-item ${active?'active':''}" style="${active ? 'background:'+t.color+';border-color:'+t.color : ''}" onclick="setFilter(${t.id})">🏷️ ${t.name}</span>`;
  });
  el.innerHTML = html;
}

function setFilter(f) {
  state.filter = f;
  renderFilterBar();
  renderTodoList();
}

// ========== 列表 ==========
function renderTodoList() {
  const el = document.getElementById('todoList');
  let list = [...state.todos];

  if (state.filter === 'undo') list = list.filter(t => !t.done);
  else if (state.filter === 'done') list = list.filter(t => t.done);
  else if (state.filter !== 'all') list = list.filter(t => t.tags.includes(state.filter));

  list.sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));

  if (!list.length) {
    el.innerHTML = '<div class="todo-empty"><span class="big">📝</span>没有待办<br>写一条吧</div>';
    document.getElementById('statsText').textContent = `${state.todos.length} 项待办`;
    return;
  }

  const total = state.todos.length;
  const doneCount = state.todos.filter(t => t.done).length;
  document.getElementById('statsText').textContent = `${total} 项待办，${doneCount} 项已完成`;

  el.innerHTML = list.map(t => {
    const date = new Date(t.createdAt);
    const dateStr =
      `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    const tagsHtml = t.tags.map(tagId => {
      const color = getTagColor(tagId);
      return `<span class="todo-tag" style="background:${color}22;color:${color}">${getTagName(tagId)}</span>`;
    }).join('');

    return `<div class="todo-item ${t.done?'done':''}">
      <div class="todo-check ${t.done?'checked':''}" onclick="toggleTodo(${t.id})">${t.done?'✓':''}</div>
      <div class="todo-body">
        <div class="todo-text">${escapeHtml(t.text)}</div>
        <div class="todo-meta">${tagsHtml}<span class="todo-date">${dateStr}</span></div>
      </div>
      <button class="todo-del" onclick="deleteTodo(${t.id})">×</button>
    </div>`;
  }).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ========== 全部渲染 ==========
function renderAll() {
  renderInputTags();
  renderFilterBar();
  renderTodoList();
  if (document.getElementById('tagMgr').classList.contains('show')) renderTagMgrList();
}

// ========== 日期 ==========
function showDate() {
  const now = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('todayStr').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekdays[now.getDay()]}`;
}

// ========== PWA 安装 ==========
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

function hideInstallBanner() {
  document.getElementById('installBanner').classList.remove('show');
}

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  const result = await installPrompt.userChoice;
  if (result.outcome === 'accepted') {
    hideInstallBanner();
    showToast('已安装到桌面 ✓');
  }
  installPrompt = null;
});

window.addEventListener('appinstalled', () => {
  hideInstallBanner();
  showToast('已安装到桌面 ✓');
});

// ========== Service Worker 注册 ==========
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ========== 初始化 ==========
loadState();
showDate();
renderAll();

// 回车
document.getElementById('todoInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});
document.getElementById('newTagInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTag();
});
</script>
</body>
</html>
