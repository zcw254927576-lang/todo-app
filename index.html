<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d3436">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WayneSpace">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>WayneSpace</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2d3436;
    --primary-light: #f0f0f0;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --danger: #e17055;
    --success: #00b894;
    --bg: #f8f9fc;
    --card: #ffffff;
    --text: #2d3436;
    --text-secondary: #636e72;
    --text-muted: #b2bec3;
    --border: #eaecef;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 100px;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  .header {
    background: linear-gradient(135deg, #2d3436 0%, #1a1a2e 100%);
    color: #fff;
    padding: 24px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    -webkit-app-region: drag;
  }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
  .header .sub { font-size: 13px; opacity: 0.7; margin-top: 2px; font-weight: 300; }
  .container { padding: 16px 20px; }

  /* 输入区 */
  .input-area {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .input-row { display: flex; gap: 10px; }
  .input-row input[type="text"] {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    background: var(--bg);
  }
  .input-row input[type="text"]:focus { border-color: var(--accent); }
  .input-row .add-btn {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    box-shadow: 0 4px 12px rgba(108,92,231,0.3);
  }
  .input-row .add-btn:active { transform: scale(0.95); opacity: 0.8; }

  /* 标签选择 */
  .tag-select {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .tag-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: none;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    opacity: 0.5;
  }
  .tag-btn:active { transform: scale(0.95); }
  .tag-btn.active { opacity: 1; }

  /* 优先级选择 */
  .priority-select {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  .priority-select > span {
    font-size: 12px;
    color: var(--text-secondary);
    margin-right: 2px;
  }
  .prio-btn {
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: var(--card);
    transition: all 0.15s;
  }
  .prio-btn.p0 { color: #d63031; border-color: #d63031; background: #fff5f5; }
  .prio-btn.p1 { color: #e17055; border-color: #e17055; background: #fff8f0; }
  .prio-btn.p2 { color: #6c5ce7; border-color: #6c5ce7; background: #f5f0ff; }
  .prio-btn.active {
    color: #fff !important;
    border-color: currentColor;
    box-shadow: 0 4px 12px currentColor;
  }
  .prio-btn.p0.active { background: #d63031; }
  .prio-btn.p1.active { background: #e17055; }
  .prio-btn.p2.active { background: #6c5ce7; }

  /* 已完成切换 */
  .done-toggle {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .done-toggle input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* 标签筛选面板 */
  .tag-filter {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    display: none;
  }
  .tag-filter.show { display: block; }
  .tag-filter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .tag-filter-header span { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .tag-filter-header .badge {
    font-size: 11px;
    background: var(--accent);
    color: #fff;
    border-radius: 20px;
    padding: 1px 8px;
  }
  .tag-filter-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-filter-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    background: var(--card);
  }
  .tag-filter-item:active { transform: scale(0.96); }
  .tag-filter-item.checked {
    border-color: currentColor;
    background: currentColor;
    color: #fff;
  }
  .tag-filter-item .check-icon {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .tag-filter-item.checked .check-icon {
    background: #fff;
    border-color: #fff;
    color: currentColor;
  }

  /* 标签管理 */
  .tag-mgr-toggle {
    text-align: right;
    margin-top: 8px;
  }
  .tag-mgr-toggle span {
    font-size: 12px;
    color: var(--primary);
    cursor: pointer;
    padding: 4px;
  }
  .tag-mgr {
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    display: none;
  }
  .tag-mgr.show { display: block; }
  .tag-mgr-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .tag-mgr-input { display: flex; gap: 6px; margin-bottom: 8px; }
  .tag-mgr-input input {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
    -webkit-appearance: none;
  }
  .tag-mgr-input input:focus { border-color: var(--primary); }
  .tag-mgr-input button {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tag-mgr-input button:active { opacity: 0.7; }
  .tag-mgr-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-mgr-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
  }
  .tag-mgr-item .del-tag {
    cursor: pointer;
    font-size: 14px;
    opacity: 0.6;
    padding: 2px;
  }
  .tag-mgr-item .del-tag:active { opacity: 1; }

  /* 过滤栏 */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-item {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .filter-item:active { transform: scale(0.96); }
  .filter-item.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* 待办列表 */
  .todo-list { display: flex; flex-direction: column; gap: 10px; }
  .todo-empty {
    text-align: center;
    padding: 80px 0;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 2;
  }
  .todo-empty .big { font-size: 56px; display: block; margin-bottom: 16px; opacity: 0.6; }
  .todo-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: all 0.2s;
    animation: fadeIn 0.25s ease;
    border: 1px solid transparent;
  }
  .todo-item:active { transform: scale(0.99); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .todo-item.done { opacity: 0.5; }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-muted); }
  .todo-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.15s;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
  }
  .todo-check:active { transform: scale(0.85); }
  .todo-check.checked {
    background: var(--success);
    border-color: var(--success);
    box-shadow: 0 2px 8px rgba(0,184,148,0.3);
  }
  .todo-body { flex: 1; min-width: 0; }
  .todo-text { font-size: 15px; line-height: 1.5; word-break: break-word; }
  .todo-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .todo-tag {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .todo-date { font-size: 11px; color: var(--text-muted); }
  .todo-del {
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    opacity: 0.5;
  }
  .todo-del:active { background: #fdf0ef; color: var(--danger); opacity: 1; }

  /* 统计 */
  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 4px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stats .clear-btn {
    color: var(--danger);
    font-size: 12px;
    cursor: pointer;
    border: none;
    background: none;
    opacity: 0.6;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .stats .clear-btn:active { opacity: 1; background: #fee; }

  /* 安装提示横幅 */
  .install-banner {
    display: none;
    background: var(--card);
    padding: 12px 16px;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    align-items: center;
    gap: 12px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .install-banner.show { display: flex; }
  .install-banner .info { flex: 1; font-size: 13px; }
  .install-banner .info strong { display: block; font-size: 14px; }
  .install-banner .close-btn {
    border: none;
    background: none;
    font-size: 18px;
    color: #999;
    cursor: pointer;
    padding: 4px;
  }
  .install-banner .install-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .install-banner .install-btn:active { opacity: 0.8; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 深色模式 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --text: #e8e8e8;
      --text-secondary: #a0a0b0;
      --text-muted: #636e72;
      --border: #2a2a4a;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .header { background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%); }
    .input-row input[type="text"],
    .tag-mgr-input input {
      background: #0f0f1a;
      color: #e8e8e8;
      border-color: #2a2a4a;
    }
    .todo-item:active { border-color: #2a2a4a; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>WayneSpace</h1>
  <div class="sub" id="todayStr"></div>
</div>

<div class="container">
  <!-- 输入 -->
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="写一个待办..." maxlength="100" autocomplete="off">
      <button class="add-btn" onclick="addTodo()">+</button>
    </div>
    <div class="tag-select" id="inputTags"></div>
    <div class="priority-select">
      <span>优先级</span>
      <button class="prio-btn p0" data-prio="0" onclick="selectPriority(0)">P0</button>
      <button class="prio-btn p1" data-prio="1" onclick="selectPriority(1)">P1</button>
      <button class="prio-btn p2 active" data-prio="2" onclick="selectPriority(2)">P2</button>
    </div>
  </div>

  <!-- 标签管理 -->
  <div class="tag-mgr-toggle">
    <span onclick="toggleTagMgr()">🏷️ 管理标签</span>
  </div>
  <div class="tag-mgr" id="tagMgr">
    <div class="tag-mgr-title">管理标签</div>
    <div class="tag-mgr-input">
      <input type="text" id="newTagInput" placeholder="新标签名称" maxlength="10">
      <button onclick="addTag()">添加</button>
    </div>
    <div class="tag-mgr-list" id="tagMgrList"></div>
  </div>

  <!-- 过滤 -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- 标签筛选面板 -->
  <div class="tag-filter" id="tagFilter">
    <div class="tag-filter-header">
      <span onclick="toggleTagFilter()">🏷️ 按标签筛选 <span class="badge" id="tagFilterBadge"></span></span>
      <span><span style="font-size:11px;color:var(--danger);cursor:pointer;opacity:0.6" onclick="clearFilterTags()">清除</span><span style="font-size:11px;color:var(--text-muted);margin-left:8px;cursor:pointer" onclick="toggleTagFilter()">▼</span></span>
    </div>
    <div class="tag-filter-list" id="tagFilterList"></div>
  </div>

  <div class="done-toggle" id="doneToggle">
    <label>
      <input type="checkbox" id="showDoneCheck" checked onchange="toggleShowDone()">
      显示已完成
    </label>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <span id="statsText">0 项待办</span>
    <button class="clear-btn" onclick="clearDone()">清除已完成</button>
  </div>

  <!-- 列表 -->
  <div class="todo-list" id="todoList"></div>
</div>

<!-- 安装横幅 -->
<div class="install-banner" id="installBanner">
  <div class="info">
    <strong>安装 WayneSpace</strong>
    <span>安装到桌面，离线也能用</span>
  </div>
  <button class="install-btn" id="installBtn">安装</button>
  <button class="close-btn" onclick="hideInstallBanner()">✕</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 数据 ==========
const TAG_COLORS = [
  '#5b7fff', '#ff6b6b', '#2ecc71', '#f39c12', '#9b59b6',
  '#1abc9c', '#e74c3c', '#3498db', '#e67e22', '#636e72'
];
const DEFAULT_TAGS = ['工作', '生活', '学习'];

let state = { todos: [], tags: [], filter: 'all', selectedTags: [], selectedPriority: 2, showDone: true, filterTags: [] };

// ========== 持久化 ==========
function loadState() {
  try {
    const raw = localStorage.getItem('todoapp_data');
    if (raw) {
      const saved = JSON.parse(raw);
      state.todos = saved.todos || [];
      state.tags = saved.tags || [];
      state.showDone = saved.showDone !== undefined ? saved.showDone : true;
      state.filterTags = saved.filterTags || [];
      return;
    }
  } catch(e) {}
  state.todos = [];
  state.tags = DEFAULT_TAGS.map((name, i) => ({
    id: Date.now() + i, name, color: TAG_COLORS[i]
  }));
}

function saveState() {
  try {
    localStorage.setItem('todoapp_data', JSON.stringify({
      todos: state.todos, tags: state.tags, showDone: state.showDone, filterTags: state.filterTags
    }));
  } catch(e) {}
}

// ========== Toast ==========
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== 标签 ==========
function getTagColor(tagId) {
  const t = state.tags.find(x => x.id === tagId);
  return t ? t.color : '#636e72';
}
function getTagName(tagId) {
  const t = state.tags.find(x => x.id === tagId);
  return t ? t.name : '未知';
}

function addTag() {
  const input = document.getElementById('newTagInput');
  const name = input.value.trim();
  if (!name) return;
  if (state.tags.find(t => t.name === name)) {
    showToast('标签已存在'); return;
  }
  state.tags.push({ id: Date.now(), name, color: TAG_COLORS[state.tags.length % TAG_COLORS.length] });
  input.value = '';
  saveState();
  renderAll();
  showToast('标签已添加');
}

function deleteTag(tagId) {
  if (!confirm('删除这个标签？')) return;
  state.tags = state.tags.filter(t => t.id !== tagId);
  state.todos.forEach(t => { t.tags = t.tags.filter(id => id !== tagId); });
  if (state.filter === tagId) state.filter = 'all';
  saveState();
  renderAll();
}

function toggleTagMgr() {
  document.getElementById('tagMgr').classList.toggle('show');
  renderTagMgrList();
}

function renderTagMgrList() {
  const el = document.getElementById('tagMgrList');
  if (!state.tags.length) {
    el.innerHTML = '<span style="font-size:13px;color:#999">还没有标签</span>';
    return;
  }
  el.innerHTML = state.tags.map(t =>
    `<span class="tag-mgr-item" style="background:${t.color}22;color:${t.color}">
      ${t.name}
      <span class="del-tag" onclick="deleteTag(${t.id})">×</span>
    </span>`
  ).join('');
}

// ========== 优先级 ==========
function selectPriority(p) {
  state.selectedPriority = p;
  document.querySelectorAll('.prio-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.prio) === p);
  });
}

function getPrioLabel(p) { return ['P0','P1','P2'][p] || 'P2'; }
function getPrioColor(p) { return ['#d63031','#e17055','#6c5ce7'][p] || '#6c5ce7'; }

// ========== 已完成切换 ==========
function toggleShowDone() {
  state.showDone = document.getElementById('showDoneCheck').checked;
  saveState();
  renderTodoList();
}

// ========== 标签筛选 ==========
function toggleTagFilter() {
  const el = document.getElementById('tagFilter');
  el.classList.toggle('show');
  if (el.classList.contains('show')) renderTagFilterList();
}

function toggleFilterTag(tagId) {
  const idx = state.filterTags.indexOf(tagId);
  if (idx > -1) state.filterTags.splice(idx, 1);
  else state.filterTags.push(tagId);
  saveState();
  renderTagFilterList();
  renderTodoList();
}

function renderTagFilterList() {
  const el = document.getElementById('tagFilterList');
  const badge = document.getElementById('tagFilterBadge');
  badge.textContent = state.filterTags.length ? `${state.filterTags.length}个` : '';
  if (!state.tags.length) {
    el.innerHTML = '<span style="font-size:13px;color:var(--text-muted)">暂无标签</span>';
    return;
  }
  el.innerHTML = state.tags.map(t => {
    const checked = state.filterTags.includes(t.id);
    return `<div class="tag-filter-item ${checked?'checked':''}" style="color:${t.color}" onclick="toggleFilterTag(${t.id})">
      <span class="check-icon">${checked?'✓':''}</span>
      ${t.name}
    </div>`;
  }).join('');
}

function clearFilterTags() {
  state.filterTags = [];
  saveState();
  renderTagFilterList();
  renderTodoList();
}

// ========== 待办 ==========
function addTodo() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) { showToast('请输入待办内容'); return; }
  state.todos.unshift({
    id: Date.now(), text, done: false, priority: state.selectedPriority,
    tags: [...state.selectedTags], createdAt: Date.now()
  });
  input.value = '';
  state.selectedTags = [];
  state.selectedPriority = 2;
  document.querySelectorAll('.prio-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.prio) === 2);
  });
  saveState();
  renderAll();
}

function toggleTodo(id) {
  const todo = state.todos.find(t => t.id === id);
  if (todo) { todo.done = !todo.done; saveState(); renderAll(); }
}

function deleteTodo(id) {
  state.todos = state.todos.filter(t => t.id !== id);
  saveState();
  renderAll();
}

function clearDone() {
  const done = state.todos.filter(t => t.done);
  if (!done.length) { showToast('没有已完成的待办'); return; }
  if (!confirm(`清除 ${done.length} 项已完成待办？`)) return;
  state.todos = state.todos.filter(t => !t.done);
  saveState();
  renderAll();
  showToast(`已清除 ${done.length} 项`);
}

// ========== 输入区标签选择 ==========
function renderInputTags() {
  const el = document.getElementById('inputTags');
  if (!state.tags.length) {
    el.innerHTML = '<span style="font-size:12px;color:#999">先添加标签</span>';
    return;
  }
  el.innerHTML = state.tags.map(t => {
    const active = state.selectedTags.includes(t.id);
    return `<button class="tag-btn ${active?'active':''}"
      style="background:${t.color}22;color:${t.color}"
      onclick="toggleSelectTag(${t.id})">${t.name}</button>`;
  }).join('');
}

function toggleSelectTag(tagId) {
  const idx = state.selectedTags.indexOf(tagId);
  if (idx > -1) state.selectedTags.splice(idx, 1);
  else state.selectedTags.push(tagId);
  renderInputTags();
}

// ========== 过滤栏 ==========
function renderFilterBar() {
  const el = document.getElementById('filterBar');
  let html =
    `<span class="filter-item ${state.filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部</span>` +
    `<span class="filter-item ${state.filter === 'undo' ? 'active' : ''}" onclick="setFilter('undo')">未完成</span>` +
    `<span class="filter-item ${state.filter === 'done' ? 'active' : ''}" onclick="setFilter('done')">已完成</span>`;
  state.tags.forEach(t => {
    const active = state.filter === t.id;
    html += `<span class="filter-item ${active?'active':''}" style="${active ? 'background:'+t.color+';border-color:'+t.color : ''}" onclick="setFilter(${t.id})">🏷️ ${t.name}</span>`;
  });
  el.innerHTML = html;
}

function setFilter(f) {
  state.filter = f;
  renderFilterBar();
  document.getElementById('doneToggle').style.display = f === 'all' ? '' : 'none';
  renderTodoList();
}

// ========== 列表 ==========
function renderTodoList() {
  const el = document.getElementById('todoList');
  let list = [...state.todos];

  if (state.filter === 'undo') list = list.filter(t => !t.done);
  else if (state.filter === 'done') list = list.filter(t => t.done);
  else if (state.filter === 'all') { if (!state.showDone) list = list.filter(t => !t.done); }
  else list = list.filter(t => t.tags.includes(state.filter));

  // 多选标签筛选
  if (state.filterTags.length) {
    list = list.filter(t => state.filterTags.some(tagId => t.tags.includes(tagId)));
  }

  list.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (a.priority ?? 2) - (b.priority ?? 2);
  });

  if (!list.length) {
    el.innerHTML = '<div class="todo-empty"><span class="big">📝</span>没有待办<br>写一条吧</div>';
    document.getElementById('statsText').textContent = `${state.todos.length} 项待办`;
    return;
  }

  const total = state.todos.length;
  const doneCount = state.todos.filter(t => t.done).length;
  document.getElementById('statsText').textContent = `${total} 项待办，${doneCount} 项已完成`;

  el.innerHTML = list.map(t => {
    const date = new Date(t.createdAt);
    const dateStr =
      `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    const tagsHtml = t.tags.map(tagId => {
      const color = getTagColor(tagId);
      return `<span class="todo-tag" style="background:${color}22;color:${color}">${getTagName(tagId)}</span>`;
    }).join('');

    const prioColor = getPrioColor(t.priority);
    const prioLabel = getPrioLabel(t.priority);
    return `<div class="todo-item ${t.done?'done':''}">
      <div class="todo-check ${t.done?'checked':''}" onclick="toggleTodo(${t.id})">${t.done?'✓':''}</div>
      <div class="todo-body">
        <div class="todo-text">
          <span class="todo-prio" style="display:inline-block;font-size:10px;font-weight:700;background:${prioColor}22;color:${prioColor};padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:middle">${prioLabel}</span>
          ${escapeHtml(t.text)}
        </div>
        <div class="todo-meta">${tagsHtml}<span class="todo-date">${dateStr}</span></div>
      </div>
      <button class="todo-del" onclick="deleteTodo(${t.id})">×</button>
    </div>`;
  }).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ========== 全部渲染 ==========
function renderAll() {
  renderInputTags();
  renderFilterBar();
  // 同步已完成切换状态
  document.getElementById('showDoneCheck').checked = state.showDone;
  document.getElementById('doneToggle').style.display = state.filter === 'all' ? '' : 'none';
  // 标签筛选面板
  renderTagFilterList();
  if (state.filterTags.length) document.getElementById('tagFilter').classList.add('show');
  renderTodoList();
  if (document.getElementById('tagMgr').classList.contains('show')) renderTagMgrList();
}

// ========== 日期 ==========
function showDate() {
  const now = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('todayStr').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekdays[now.getDay()]}`;
}

// ========== PWA 安装 ==========
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

function hideInstallBanner() {
  document.getElementById('installBanner').classList.remove('show');
}

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  const result = await installPrompt.userChoice;
  if (result.outcome === 'accepted') {
    hideInstallBanner();
    showToast('已安装到桌面 ✓');
  }
  installPrompt = null;
});

window.addEventListener('appinstalled', () => {
  hideInstallBanner();
  showToast('已安装到桌面 ✓');
});

// ========== Service Worker 注册 ==========
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ========== 初始化 ==========
loadState();
showDate();
renderAll();

// 回车
document.getElementById('todoInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});
document.getElementById('newTagInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTag();
});
</script>
</body>
</html>
